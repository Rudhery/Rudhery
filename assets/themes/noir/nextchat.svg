<g class="f" style="animation-delay:.95s"><text x="392" y="186" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#d4d4cf">A multi-user platform with per-agent login, sectors and handoff, a built-in</text><text x="392" y="213" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#d4d4cf">Kanban, scheduled messages, automations, and an integrations API with webhooks and</text><text x="392" y="240" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#d4d4cf">an MCP server, so AI agents can take conversations and pass them back to the team.</text></g>
